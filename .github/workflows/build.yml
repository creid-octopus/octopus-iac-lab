name: CI / Build Image

# Builds + pushes the randomquotes image to GHCR. For STABLE images (main),
# that's it — Octopus's external-feed trigger sees the new tag, mints a release
# on the project's default branch, and Dev auto-deploys. No release-create
# from CI for the stable path.
#
# For PREVIEW images (PRs off feat/*), CI does create the release — see the
# create-ephemeral-release job. A feed trigger can't provision a native
# ephemeral env: it only creates releases from the default branch (main), so it
# never carries the PR branch ref the provisioning runbook needs. Only CI holds
# BOTH the PR branch ref AND the per-PR image tag, so CI creates the release from
# the PR branch into the Ephemeral Previews channel; Octopus then provisions the
# preview env (spin-up-preview runbook) and deploys it (deployment process).
#
# (Note: Octopus's `Octopus.ArgoCDUpdateImageTags` step writes image tags
# into the helm chart values under `gitops/`, which sits outside this
# filter, so the build → release → image-update loop can't form.)

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/octopus-iac-lab

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      pr_tag: ${{ steps.version.outputs.pr_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: version
        # Pin a 1.1.x base so we don't collide with 1.0.x tags from earlier
        # workflow incarnations sitting in GHCR. Bump the major prefix
        # whenever this workflow file gets recreated.
        # PRs publish a semver pre-release tag `1.1.<run>-pr<N>`. The `-pr<N>`
        # pre-release is what Octopus's ephemeral-channel version rule matches
        # (tag `pr`) to route the image to a preview env, while stable
        # `1.1.<run>` builds route to the Default channel (no pre-release).
        run: |
          echo "version=1.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "pr_tag=1.1.${{ github.run_number }}-pr${{ github.event.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (main)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          build-args: VERSION=${{ steps.version.outputs.version }}

      - name: Build and push (preview)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          # Immutable `1.1.<run>-pr<N>` is the version the Octopus ephemeral
          # release pins, so its deployment process deploys this exact build
          # (a moving tag wouldn't re-pull under IfNotPresent). The moving
          # `pr<N>` is what the Argo ApplicationSet preview tracks instead.
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.pr_tag }}
            ${{ env.IMAGE }}:pr${{ github.event.number }}
          build-args: VERSION=${{ steps.version.outputs.pr_tag }}

  push-build-info:
    # Push GitHub-sourced build information (commits, build URL, VCS root,
    # branch) to both Octopus targets after the image lands. The external-feed
    # trigger mints the release from the image tag; this attaches the source
    # branch + commit history. PR builds push it too (keyed on the pr<N> tag)
    # so the preview's release carries its source branch.
    name: Push Build Info → Octopus
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: local
            url_secret: OCTOPUS_LOCAL_URL
            key_secret: OCTOPUS_LOCAL_API_KEY
          - name: saas
            url_secret: OCTOPUS_SAAS_URL
            key_secret: OCTOPUS_SAAS_API_KEY
    steps:
      - uses: actions/checkout@v4

      # Local leg is best-effort — if its URL is unreachable from GHA the
      # job continues; SaaS is the source of truth.
      - name: Push build information (${{ matrix.target.name }})
        continue-on-error: ${{ matrix.target.name == 'local' }}
        uses: OctopusDeploy/push-build-information-action@v4
        env:
          OCTOPUS_URL: ${{ secrets[matrix.target.url_secret] }}
          OCTOPUS_API_KEY: ${{ secrets[matrix.target.key_secret] }}
          OCTOPUS_SPACE: IaC Sandbox
        with:
          # Package ID must match the value Octopus stores on the GHCR feed —
          # that's the image repo WITHOUT the `ghcr.io/` registry prefix
          # (the prefix lives on the feed, not the package). The OCL
          # references the same shape: `package_id = "creid-octopus/octopus-iac-lab"`.
          # Mismatching `ghcr.io/...` here would push valid build info into
          # Octopus, but the release-snapshot lookup at release-create time
          # wouldn't match and the release page would render empty.
          packages: ${{ github.repository_owner }}/octopus-iac-lab
          version: ${{ github.event_name == 'pull_request' && needs.build.outputs.pr_tag || needs.build.outputs.version }}
          # Build info push happens just after image push; if a previous run
          # of the same workflow already wrote info for this version (re-run
          # of the same run_number), prefer overwrite over failing the job.
          overwrite_mode: OverwriteExisting

  create-ephemeral-release:
    # PR-only: create the randomquotes release in the Ephemeral Previews channel
    # FROM THE PR BRANCH. git_ref gives Octopus the branch context to provision
    # the preview env and read the branch's deployment process + runbook.
    # release_number/package_version pin the immutable `1.1.<run>-pr<N>` tag: the
    # env-name template derives the `preview-pr<N>` slug from it, and the
    # deployment process deploys that exact image.
    # Gated on feat/* to match the channel's GitReferenceRules.
    #
    # Both targets get a preview: tofu/app-randomquotes/ephemeral.tf provisions
    # the Previews parent env + Ephemeral Previews channel on every instance, and
    # the #{Source} discriminator in K8s.Namespace/App.Host keeps the two previews
    # from colliding on the shared cluster (randomquotes-{local,saas}-preview-prN).
    name: Create Ephemeral Release → Octopus
    needs: [build, push-build-info]
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'feat/')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: local
            url_secret: OCTOPUS_LOCAL_URL
            key_secret: OCTOPUS_LOCAL_API_KEY
          - name: saas
            url_secret: OCTOPUS_SAAS_URL
            key_secret: OCTOPUS_SAAS_API_KEY
    steps:
      - name: Create ephemeral release (${{ matrix.target.name }})
        continue-on-error: ${{ matrix.target.name == 'local' }}
        uses: OctopusDeploy/create-release-action@v3
        env:
          OCTOPUS_URL: ${{ secrets[matrix.target.url_secret] }}
          OCTOPUS_API_KEY: ${{ secrets[matrix.target.key_secret] }}
          OCTOPUS_SPACE: IaC Sandbox
        with:
          project: randomquotes
          channel: Ephemeral Previews
          release_number: ${{ needs.build.outputs.pr_tag }}
          package_version: ${{ needs.build.outputs.pr_tag }}
          git_ref: ${{ github.head_ref }}

