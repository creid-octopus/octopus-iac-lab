{{- if .Values.image.tag }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: randomquotes
  labels:
    app: randomquotes
    app.kubernetes.io/name: randomquotes
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: randomquotes
    tenant.octopus.com/tier: {{ .Values.tier | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: randomquotes
  template:
    metadata:
      labels:
        app: randomquotes
        app.kubernetes.io/name: randomquotes
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: randomquotes
        tenant.octopus.com/tier: {{ .Values.tier | quote }}
      annotations:
        # Roll the pod when the ConfigMap content changes — k8s doesn't
        # auto-restart on volume-mount updates.
        configmap-checksum: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: randomquotes
          # Registry is a value, not hardcoded. It used to be a literal
          # `ghcr.io/`, which meant every pod tried to pull from GitHub no
          # matter what the Octopus feed was pointed at — offline that's an
          # unreachable host and the Application sits Degraded on
          # ImagePullBackOff.
          image: {{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}
          # IfNotPresent so a locally-loaded image wins. The Gitea Actions
          # workflow imports each build straight into containerd on both
          # nodes, so pods still start even if the registry is unreachable
          # mid-demo. With Always, that safety net does nothing.
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: 80
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /usr/share/nginx/html/config.json
              subPath: config.json
      volumes:
        - name: config
          configMap:
            name: randomquotes-config
{{- end }}
