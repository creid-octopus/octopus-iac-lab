# Argo CD Applications for the demo-branch flavours of randomquotes.
#
# Each Octopus demo project (<slug>-randomquotes) whose deployment
# process carries an `Update Argo CD Application Image Tags` step looks
# up Applications by annotation match — this ApplicationSet generates the
# matching Applications, one per (flavour × tenantEnv × source).
#
# branch choice per flavour:
#   - Pin to refs/heads/demo/<slug> when the flavour's chart shape
#     diverges from main and must render off its own branch
#     (blue-green, bg-preview, canary — canary adds an Argo Rollout +
#     traffic-split via templates/rollout.yaml gated on envType).
#   - Point at HEAD when the flavour deploys main's plain chart and its
#     special behaviour is entirely Octopus-side (servicenow-cr-gate,
#     process-template, smoke-step-template). process-template's Argo
#     step lives inside the k8s-tenanted-app Platform Hub template it
#     instantiates; smoke-step-template carries the step directly.
#
# platform-hub-opa-randomquotes is intentionally absent — its OCL has
# no Update Argo step (the demo's enforcement is K8s admission via
# Gatekeeper, not GitOps drift), so there's no Application for the
# Gateway to correlate. Re-add only if its process gains an Argo step.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: randomquotes-demos
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          # (flavour × tenantEnv) × source — tenantEnv is a single
          # flattened list rather than tenant × env Cartesian, so we
          # can encode the lab's per-tenant lifecycle scoping directly:
          # acme-corp lives on Dev + Production (canary tenant); globex
          # and initech are Production-only. Mirrors the
          # `octopusdeploy_tenant_project.environment_ids` rule in
          # tofu/app-randomquotes/{project,branch_demos}.tf.
          - matrix:
              generators:
                - list:
                    # Add a flavour here only once its Octopus project
                    # actually applies. All 6 at once filled the local
                    # cluster (48 Applications, 100+ pods) and most of the
                    # projects still don't work (missing channels/step
                    # templates — see docs/conference-demo-readiness.md).
                    #
                    # Each flavour costs 8 Applications (4 tenantEnv × 2
                    # sources), but only the 2 Dev ones render pods: the
                    # production values files ship `image.tag: ""` as a
                    # sentinel, so Production renders no Deployment until
                    # Octopus promotes a release.
                    elements:
                      - flavour: process-template
                        branch: HEAD
                        previewEnabled: "false"
                    # - flavour: blue-green
                    #   branch: refs/heads/demo/blue-green
                    #   previewEnabled: "false"
                    # - flavour: bg-preview
                    #   branch: refs/heads/demo/bg-preview
                    #   previewEnabled: "true"
                    # - flavour: canary
                    #   branch: refs/heads/demo/canary
                    #   previewEnabled: "false"
                    # - flavour: servicenow-cr-gate
                    #   branch: HEAD
                    #   previewEnabled: "false"
                    # - flavour: smoke-step-template
                    #   branch: HEAD
                    #   previewEnabled: "false"
                - list:
                    elements:
                      - tenant: acme-corp
                        env: Dev
                        envLower: dev
                        mood: comedy
                        icon: "🃏"
                        brandColor: "#F5C518"
                        replicaCount: "1"
                        tier: enterprise
                      - tenant: acme-corp
                        env: Production
                        envLower: production
                        mood: comedy
                        icon: "🃏"
                        brandColor: "#F5C518"
                        replicaCount: "3"
                        tier: enterprise
                      - tenant: globex
                        env: Production
                        envLower: production
                        mood: silicon-valley
                        icon: "🚀"
                        brandColor: "#00B0FF"
                        replicaCount: "2"
                        tier: pro
                      - tenant: initech
                        env: Production
                        envLower: production
                        mood: stoic
                        icon: "🧘"
                        brandColor: "#7E57C2"
                        replicaCount: "1"
                        tier: free
          - list:
              elements:
                - source: local
                - source: saas
  template:
    metadata:
      name: '{{.flavour}}-randomquotes-{{.source}}-{{.tenant}}-{{.envLower}}'
      namespace: argocd
      annotations:
        argo.octopus.com/project: '{{.flavour}}-randomquotes'
        argo.octopus.com/environment: '{{.envLower}}'
        argo.octopus.com/tenant: '{{.tenant}}'
        # Tells Octopus which Helm value holds the image tag. Required here
        # because the k8s-tenanted-app process template's AppImage package
        # has no HelmReplacementPath — with neither set, the step finds no
        # path and the tag update is a no-op.
        #
        # The registry MUST be part of the expression: Octopus matches the
        # fully qualified name against the step's package and skips
        # replacement when the registry differs. Hardcoding `ghcr.io` here
        # breaks the moment `make gitea-enable` repoints the chart.
        #
        # The backtick raw string escapes this from the ApplicationSet's own
        # Go templating (goTemplate: true), so the `{{ .Values… }}` text
        # reaches the annotation verbatim for Octopus to evaluate.
        argo.octopus.com/image-replace-paths: '{{ `{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}` }}'
      labels:
        lab.octopus.com/source: '{{.source}}'
        lab.octopus.com/tenant: '{{.tenant}}'
        lab.octopus.com/flavour: '{{.flavour}}'
    spec:
      # Scope each generated leaf to its source's AppProject (local/saas) so
      # the matching Gateway's RBAC-scoped account surfaces only its own side.
      project: '{{.source}}'
      source:
        repoURL: http://host.docker.internal:3000/admin/octopus-iac-lab
        # Each flavour's chart is the source of truth on its own branch.
        # The Octopus auto-update step also commits image.tag updates
        # back to THIS branch — keeping the demo branch self-contained.
        targetRevision: '{{.branch}}'
        path: gitops/charts/randomquotes
        helm:
          releaseName: randomquotes
          valueFiles:
            - values-{{.source}}-{{.envLower}}.yaml
          valuesObject:
            replicaCount: '{{.replicaCount}}'
            tier: '{{.tier}}'
            tenant: '{{.tenant}}'
            mood: '{{.mood}}'
            icon: '{{.icon}}'
            brandColor: '{{.brandColor}}'
            watermark: ""
            host: 'argo-{{.flavour}}-{{.source}}-{{.tenant}}-{{.envLower}}.localtest.me'
            previewHost: '{{- if eq .previewEnabled "true" -}}argo-{{.flavour}}-preview-{{.source}}-{{.tenant}}-{{.envLower}}.localtest.me{{- end -}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'argo-randomquotes-{{.flavour}}-{{.source}}-{{.tenant}}-{{.envLower}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
