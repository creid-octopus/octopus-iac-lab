# GitOps source of truth — Argo CD reconciles to this. Edit + push to update.
# argo.octopus.com/* annotations are claimed by Octopus's Argo CD Gateway
# and surface this Application against the matching project/env/tenant.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: randomquotes-globex-production-local
  namespace: argocd
  annotations:
    argo.octopus.com/project: randomquotes
    argo.octopus.com/environment: production
    argo.octopus.com/tenant: globex
    # The image-replace-paths annotation is a backup discovery mechanism
    # used by Octopus's update-argo-cd-application-image-tags step when
    # the step itself has no helm image path configured. We DO configure
    # one (Octopus.Action.ArgoCD.HelmImageTagPaths="image.tag" in the
    # deployment_process.ocl), so this annotation is currently a no-op —
    # kept for documentation and to ease swapping back to annotation-driven
    # discovery if we ever need per-Application path overrides.
    argo.octopus.com/image-replace-paths: "ghcr.io/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
  labels:
    lab.octopus.com/source: local
    lab.octopus.com/tenant: globex
spec:
  project: local
  source:
    repoURL: https://github.com/creid-octopus/octopus-iac-lab
    path: gitops/charts/randomquotes
    targetRevision: HEAD
    helm:
      releaseName: randomquotes
      valueFiles:
        - values-local-production.yaml
      valuesObject:
        replicaCount: 2
        tier: pro
        tenant: globex
        mood: silicon-valley
        icon: "🚀"
        brandColor: "#00B0FF"
        watermark: ""
        maintenance: ""
        host: argo-local-globex-production.localtest.me
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-randomquotes-local-globex-production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
