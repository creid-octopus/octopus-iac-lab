# Offline port of .github/workflows/build.yml.
#
# Builds the randomquotes image, loads it into both Kubernetes nodes, AND
# pushes it to Gitea's built-in registry. Both, deliberately: the registry
# gives Octopus a feed to resolve package versions from, and the containerd
# import means pods still start if a registry pull fails mid-demo.
#
# Every step is `run:`. Nothing uses `uses:`, deliberately: Gitea resolves
# `uses:` references against github.com unless you mirror the action repos
# into Gitea and set `github_mirror` (see compose/act-runner-config.yaml).
# Plain shell has no such dependency, and this workflow only needs git,
# docker, and curl — all present in the local job image.
#
# Differences from the GitHub version, and why:
#   - no actions/checkout    -> git clone from Gitea over the shared network
#   - no docker/login-action -> plain `docker login` against Gitea
#   - GHCR push              -> push to Gitea's registry + ctr import per node
#   - no push-build-information / create-release steps; on the GitHub path an
#     Octopus feed trigger mints the release when a new tag appears. Whether
#     that trigger fires against the Gitea feed is untested.
#
# Secrets are LAB_GIT_TOKEN / LAB_GIT_USERNAME, not GITEA_*: Gitea reserves
# the GITEA_ prefix for secret names and silently rejects it.

name: CI / Build Image

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
  workflow_dispatch:

env:
  # Local build tag. Kept short for the ctr-import path.
  IMAGE_NAME: octopus-iac-lab/randomquotes
  # Registry path. MUST equal the `package_id` that
  # .octopus/deployment_process.ocl uses, or the Octopus feed won't resolve
  # the package. Offline that's admin/octopus-iac-lab (the Gitea admin's
  # namespace); on github it's creid-octopus/octopus-iac-lab. The two differ,
  # so set-git-backend.sh rewrites package_id as part of the switch.
  #
  # host.docker.internal, not gitea:3000 — Octopus queries this registry for
  # versions AND kubelet pulls from it, so it has to resolve from both the
  # compose network and the cluster.
  REGISTRY: host.docker.internal:3000
  REGISTRY_PATH: admin/octopus-iac-lab
  # Both nodes of the Docker Desktop kind-based cluster. A pod can be
  # scheduled on either, so the image has to exist on both or you get
  # ImagePullBackOff about half the time.
  KIND_NODES: "desktop-control-plane desktop-worker"

jobs:
  build:
    name: Build & load image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout from Gitea
        # Replaces actions/checkout. `gitea` resolves because the runner
        # config puts job containers on the Octopus compose network.
        # GITEA_TOKEN is a user-level Actions secret created by
        # compose/configure-gitea.sh.
        run: |
          set -euo pipefail
          git clone --depth 1 \
            "http://${{ secrets.LAB_GIT_USERNAME }}:${{ secrets.LAB_GIT_TOKEN }}@gitea:3000/admin/octopus-iac-lab.git" \
            src
          cd src
          echo "cloned $(git rev-parse --short HEAD)"

      - name: Set version
        # Same 1.1.<run> scheme as the GitHub workflow so version numbers
        # stay comparable between the two paths.
        run: |
          echo "VERSION=1.1.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build image
        run: |
          set -euo pipefail
          cd src
          docker build \
            -t "${IMAGE_NAME}:${VERSION}" \
            -t "${IMAGE_NAME}:latest" \
            --build-arg "VERSION=${VERSION}" \
            app
          docker image inspect "${IMAGE_NAME}:${VERSION}" \
            --format '    built {{.RepoTags}} {{.Size}} bytes'

      - name: Load image into the cluster
        # Deliberately not `kind load`: the kind CLI may not be installed,
        # and Docker Desktop's provisioner doesn't necessarily label its
        # containers the way `kind get clusters` expects. `ctr import`
        # against each node needs nothing but the docker socket.
        #
        # Streamed over stdin rather than `docker cp` + a file in the node.
        # The cp route has two filesystems in play (the job container's, then
        # the node's) and failed with "ctr: open /tmp/img.tar: no such file"
        # even though cp reported success. Piping keeps it to one hop.
        #
        # Namespace k8s.io matters — containerd serves kubelet from that
        # namespace, so an image imported into the default one is invisible
        # to Kubernetes.
        run: |
          set -euo pipefail
          TAR=/tmp/image.tar
          docker save "${IMAGE_NAME}:${VERSION}" "${IMAGE_NAME}:latest" -o "$TAR"
          ls -l "$TAR"

          for node in ${KIND_NODES}; do
            echo "--- ${node}"
            docker exec -i "$node" ctr -n k8s.io images import - < "$TAR"
            # Verify rather than trust: a silent no-op here is the difference
            # between a green build and a deployment that can't find its image.
            docker exec "$node" ctr -n k8s.io images ls \
              | grep "${IMAGE_NAME}:${VERSION}" \
              || { echo "ERROR: import reported success but image is absent on ${node}"; exit 1; }
          done
          rm -f "$TAR"

      - name: Push to the Gitea registry
        # Gives Octopus a real feed to resolve package versions from, which
        # is what lets the deployment process keep its `feed = "ghcr"` +
        # package_id references unchanged between cloud and offline.
        #
        # Requires "insecure-registries": ["host.docker.internal:3000"] in
        # Docker Desktop's engine config — the push is performed by the HOST
        # daemon (this container just drives it over the mounted socket), so
        # it's the host daemon that has to accept plain HTTP.
        run: |
          set -euo pipefail
          REF="${REGISTRY}/${REGISTRY_PATH}"

          echo "${{ secrets.LAB_GIT_TOKEN }}" \
            | docker login "${REGISTRY}" -u "${{ secrets.LAB_GIT_USERNAME }}" --password-stdin

          docker tag "${IMAGE_NAME}:${VERSION}" "${REF}:${VERSION}"
          docker tag "${IMAGE_NAME}:${VERSION}" "${REF}:latest"
          docker push "${REF}:${VERSION}"
          docker push "${REF}:latest"

          # Confirm the registry really has it, rather than trusting the push.
          curl -fsS -u "${{ secrets.LAB_GIT_USERNAME }}:${{ secrets.LAB_GIT_TOKEN }}" \
            "http://${REGISTRY}/v2/${REGISTRY_PATH}/tags/list" \
            || { echo "ERROR: push reported success but the registry has no tags"; exit 1; }

      - name: Summary
        run: |
          cat <<SUMMARY
              Local tag:  ${IMAGE_NAME}:${VERSION}
              Registry:   ${REGISTRY}/${REGISTRY_PATH}:${VERSION}
              Loaded into: ${KIND_NODES}

              Octopus should now see version ${VERSION} of
              ${REGISTRY_PATH} on the GHCR feed.

              The image is BOTH in the registry and pre-loaded into
              containerd. Belt and braces: if a registry pull fails mid-demo,
              pods with imagePullPolicy IfNotPresent still start.
          SUMMARY
